<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Bookclub</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .card {
            margin-bottom: 20px;
        }

        .container {
            margin-top: 40px;
        }
    </style>
</head>

<body>

<!-- Header (optional) -->
<!--<div th:replace="fragments/header :: header"></div> -->
<div th:replace="header :: header"></div>
<div class="container">

    <h2 class="text-center mb-4">Book List</h2>

    <div class="row">

        <!-- LOOP THROUGH BOOKS -->
        <div class="col-md-4" th:each="book : ${books}">

            <div class="card shadow-sm">

                <div class="card-body">

                    <!-- Title -->
                    <h5 class="card-title" th:text="${book.title}">Book Title</h5>

                    <!-- ISBN -->
                    <p class="card-text text-muted">
                        <small th:text="${book.isbn}">ISBN</small>
                    </p>

                    <!-- Buttons -->
                    <div class="d-flex justify-content-between">

                        <!-- View Details -->
                        <a th:href="@{/monthly-books/view(id=${book.isbn})}" class="btn btn-primary">
                            View
                        </a>
                        <!-- OpenLibrary Link -->
                        <a th:href="${book.infoUrl}"
                           target="_blank"
                           class="btn btn-sm btn-outline-secondary">
                            Web Link
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
