<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Header</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div th:fragment="header">

    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">

            <!-- Logo -->
            <a class="navbar-brand" th:href="@{/}">Bookclub</a>

            <!-- Navbar Links -->
            <div class="collapse navbar-collapse">

                <div sec:authorize="isAuthenticated()">
                    Logged in as <strong sec:authentication="name"></strong>
                </div>

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/about}">About Us</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/contact}">Contact Us</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/wishlist}">Wishlist</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/swagger-ui/index.html" target="_blank">
                            OpenAPI
                        </a>
                    </li>
                    <li class="nav-item"
                        sec:authorize="hasRole('ADMIN')">

                        <a class="nav-link"
                           th:href="@{/monthly-books}">
                            Monthly Books
                        </a>
                    </li>



                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/logout}">Logout</a>
                    </li>

                </ul>
            </div>

        </div>
    </nav>

</div>

</body>
</html>
