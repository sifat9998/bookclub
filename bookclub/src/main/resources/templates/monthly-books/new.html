<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>New Monthly Book</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="container mt-5">

    <h1 class="text-center mb-4">
        New Monthly Book Form
    </h1>

    <form th:action="@{/monthly-books}"
          th:object="${bookOfTheMonth}"
          method="post">

        <!-- Month -->
        <div class="mb-3">

            <label for="month" class="form-label">
                Months
            </label>

            <select name="month"
                    id="month"
                    class="form-select"
                    th:field="*{month}">

                <option th:each="m : ${months.keySet()}"
                        th:value="${m}"
                        th:text="${months.get(m)}">
                </option>

            </select>

        </div>

        <!-- ISBN -->
        <div class="mb-3">

            <label for="isbn" class="form-label">
                ISBN
            </label>

            <input type="text"
                   class="form-control"
                   id="isbn"
                   th:field="*{isbn}"/>

        </div>

        <!-- Error -->
        <div class="text-danger mb-3"
             th:if="${#fields.hasErrors('isbn')}"
             th:errors="*{isbn}">
        </div>

        <!-- Button -->
        <button type="submit"
                class="btn btn-primary">
            Create
        </button>

    </form>

    <br>

    <a href="/monthly-books">
        Return to Monthly Books
    </a>

</div>

</body>
</html>
