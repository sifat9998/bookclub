<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Book Details</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .container {
            margin-top: 50px;
        }

        .card {
            padding: 20px;
        }
    </style>
</head>

<body>

<!-- Header (optional) -->
<!-- <div th:replace="fragments/header :: header"></div>-->
<div th:replace="fragments/header :: header"></div>
<div class="container">

    <h2 class="text-center mb-4">Book of the Month Details</h2>

    <div class="card shadow-sm">

        <!-- Title -->
        <h4 th:text="${book.title}">Book Title</h4>

        <hr>

        <!-- Pages -->
        <p>
            <strong>Pages:</strong>
            <span th:text="${book.numOfPages}">0</span>
        </p>

        <!-- Description -->
        <p>
            <strong>Description:</strong><br>
            <span th:text="${book.description}">Description here</span>
        </p>

        <!-- Web Link -->
        <p>
            <strong>Web Link:</strong><br>
            <a th:href="${book.infoUrl}"
               th:text="${book.infoUrl}"
               target="_blank">
                Open Library
            </a>
        </p>

        <hr>

        <!-- Back Button -->
        <a th:href="@{/}" class="btn btn-secondary">Return to Books</a>

    </div>

</div>

</body>
</html>
