<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Wishlist</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .wishlist-container {
            margin-top: 60px;
        }

        h2 {
            margin-bottom: 20px;
        }

        .btn-new {
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
<div th:replace="header :: header"></div>
<!-- Include Header -->
<!--<div th:replace="fragments/header :: header"></div>-->

<div class="container wishlist-container">

    <!-- Title -->
    <div class="text-center">
        <h2>My Wishlist</h2>
    </div>

    <!-- New Item Button -->
    <div class="text-center btn-new">
        <a href="/wishlist/new" class="btn btn-outline-secondary">
            New Wishlist Item
        </a>
    </div>

    <!-- TABLE WILL LOAD HERE -->
    <div id="wishlist"></div>

</div>

<!-- JavaScript Section -->
<script>
    document.addEventListener("DOMContentLoaded", function () {

        class HttpClient {
            async get(url) {
                const res = await fetch(url);
                return res.json();
            }
        }

        function buildTable(books) {
            let tableString = `
        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th>ISBN</th>
                    <th>Title</th>
                    <th>Functions</th>
                </tr>
            </thead>
            <tbody>
        `;

            for (let book of books) {
                tableString += `
            <tr>
                <td>${book.isbn}</td>
                <td>${book.title}</td>
               <td>
    <a href="/wishlist/${book.id}" class="text-primary">Edit</a> |
    <a href="/wishlist/remove/${book.id}" class="text-danger">Delete</a>
</td>
            </tr>
            `;
            }

            tableString += `</tbody></table>`;
            return tableString;
        }

        const http = new HttpClient();

        http.get("/api/wishlist")
            .then(res => {
                console.log("DATA:", res);

                const container = document.getElementById("wishlist");
                console.log("DIV:", container);

                container.innerHTML = buildTable(res);
            })
            .catch(error => console.error("Error:", error));

    });
</script>

</body>
</html>
