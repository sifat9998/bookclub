<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>View Wishlist Item</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body>

<div th:replace="fragments/header :: header"></div>

<div class="container mt-5">

    <h2>View Wishlist Item Form</h2>

    <form th:action="@{/wishlist/update}" method="post" th:object="${wishlistItem}">

        <input type="hidden" th:field="*{id}"/>

        <div class="mb-3">
            <label>ISBN</label>
            <input type="text" class="form-control" th:field="*{isbn}"/>
        </div>

        <div class="mb-3">
            <label>Title</label>
            <input type="text" class="form-control" th:field="*{title}"/>
        </div>

        <button type="submit" class="btn btn-primary">Update</button>

    </form>

    <br>

    <a href="/wishlist">Return to wishlist</a>

</div>

</body>
</html>
